<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Out – Offline</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #f0f4ff;
      --text: #1e1b4b;
      --text-muted: #7c7aaa;
      --surface: rgba(255,255,255,0.8);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0e1a;
        --text: #e8e6ff;
        --text-muted: #7874aa;
        --surface: rgba(26,24,48,0.8);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .container {
      background: var(--surface);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(99,102,241,0.12);
    }
    .emoji { font-size: 4rem; margin-bottom: 1rem; display: block; }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(99,102,241,0.45);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="emoji">📡</span>
    <h1>You're Offline</h1>
    <p>
      Looks like you've lost your connection. The weather gods need Wi-Fi too.
      <br><br>
      Step Out will use your cached forecast when you reconnect.
    </p>
    <a href="./" class="btn">← Back to App</a>
  </div>
</body>
</html>
